services:
  vllm-chat:
    image: vllm/vllm-openai:latest
    container_name: drake-vllm-chat
    command:
      - --model
      - Qwen/Qwen2.5-7B-Instruct
      - --served-model-name
      - qwen2.5-7b-instruct
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "32768"
    ports:
      - "8000:8000"
    volumes:
      - vllm_hf_cache:/root/.cache/huggingface
    environment:
      HF_HOME: /root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  vllm-embedding:
    image: vllm/vllm-openai:latest
    container_name: drake-vllm-embedding
    command:
      - --model
      - BAAI/bge-m3
      - --served-model-name
      - bge-m3
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --task
      - embed
    ports:
      - "8001:8001"
    volumes:
      - vllm_hf_cache:/root/.cache/huggingface
    environment:
      HF_HOME: /root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  vllm-ocr:
    image: vllm/vllm-openai:latest
    container_name: drake-vllm-ocr
    command:
      - --model
      - Qwen/Qwen2.5-VL-7B-Instruct
      - --served-model-name
      - qwen2.5-vl-7b
      - --host
      - 0.0.0.0
      - --port
      - "8700"
      - --max-model-len
      - "32768"
    ports:
      - "8700:8700"
    volumes:
      - vllm_hf_cache:/root/.cache/huggingface
    environment:
      HF_HOME: /root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  vllm_hf_cache:

version: "3.9"
# Use this for production deployment:
# docker compose --env-file env/deployment/.env.production -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:15-alpine
    container_name: drakeai_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drakeai}
      POSTGRES_USER: ${POSTGRES_USER:-drakeai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Drake_AI_Kalpra123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drakeai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: drakeai_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  minio:
    image: minio/minio:latest
    container_name: drakeai_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-drakeai_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-drakeai_minio_secret}
    volumes:
      - minio_data:/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: drakeai_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-drakeai}:${POSTGRES_PASSWORD:-Drake_AI_Kalpra123}@postgres:5432/${POSTGRES_DB:-drakeai}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-drakeai_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-drakeai_minio_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-drakeai-files}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      SECRET_KEY: ${SECRET_KEY:-change-in-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-Drake6105}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Drake123@}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-Admin}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VLLM_API_KEY: ${VLLM_API_KEY:-EMPTY}
      VLLM_CHAT_BASE_URL: ${VLLM_CHAT_BASE_URL:-http://vllm-chat:8000/v1}
      VLLM_EMBEDDING_BASE_URL: ${VLLM_EMBEDDING_BASE_URL:-http://vllm-embedding:8001/v1}
      VLLM_OCR_BASE_URL: ${VLLM_OCR_BASE_URL:-http://vllm-ocr:8700/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5-7b-instruct}
      VLLM_OCR_MODEL: ${VLLM_OCR_MODEL:-qwen2.5-vl-7b}
      VLLM_TIMEOUT_SECONDS: ${VLLM_TIMEOUT_SECONDS:-120}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost","http://localhost:80","http://localhost:8080"]}'
      APP_ENV: ${APP_ENV:-production}
      DEBUG: ${DEBUG:-false}
    volumes:
      - upload_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head &&
             python -c 'from app.core.seed import seed_db; seed_db()' &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-/}
        VITE_PORTAL_MODE: user
    container_name: drakeai_frontend
    depends_on:
      - backend
    restart: unless-stopped

  admin_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-/}
        VITE_PORTAL_MODE: admin
    container_name: drakeai_admin_frontend
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: drakeai_nginx
    ports:
      - "80:80"
      - "8080:8080"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - admin_frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  upload_data:

version: "3.9"

# Deploy only the user dashboard.
# Set VITE_API_URL to the shared backend URL, for example:
# VITE_API_URL=https://api.your-domain.com docker compose -f docker-compose.user.yml up --build -d

services:
  user_dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile.user
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8002}
    container_name: drakeai_user_dashboard
    ports:
      - "${USER_DASHBOARD_PORT:-80}:3000"
    restart: unless-stopped
